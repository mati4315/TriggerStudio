<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>TriggerStudio Overlay</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: transparent; /* transparent for OBS Browser Source */
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #media-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100%;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.25s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #media-container.visible {
      opacity: 1;
      transform: scale(1);
    }
    video, img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5); /* subtle drop shadow for premium look */
      border-radius: 16px; /* rounded corners for modern vibe */
    }
  </style>
</head>
<body>
  <div id="media-container">
    <video id="video-player" playsinline></video>
    <img id="image-player" style="display: none;" />
    <audio id="audio-player"></audio>
  </div>
  <script>
    const container = document.getElementById('media-container');
    const videoPlayer = document.getElementById('video-player');
    const imagePlayer = document.getElementById('image-player');
    const audioPlayer = document.getElementById('audio-player');

    let ws;
    let activeSourceName = '';
    let activeAssetName = '';
    let activeMediaElement = null;
    let activeInputKind = '';
    let activeVolume = 100;
    let progressTimer = null;
    let sourceClearTimer = null;
    let mediaAudioContext = null;
    const mediaGainNodes = new WeakMap();

    function getMediaGainNode(mediaElement) {
      if (mediaGainNodes.has(mediaElement)) return mediaGainNodes.get(mediaElement);
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return null;

      try {
        if (!mediaAudioContext) mediaAudioContext = new AudioContextClass();
        const source = mediaAudioContext.createMediaElementSource(mediaElement);
        const gain = mediaAudioContext.createGain();
        source.connect(gain);
        gain.connect(mediaAudioContext.destination);
        mediaGainNodes.set(mediaElement, gain);
        return gain;
      } catch (error) {
        console.warn('Could not create media volume control:', error);
        return null;
      }
    }

    function setMediaVolume(volumePercent) {
      activeVolume = Math.max(0, Math.min(200, Number(volumePercent) || 0));
      if (!activeMediaElement) return;

      const multiplier = activeVolume / 100;
      const existingGain = mediaGainNodes.get(activeMediaElement);
      if (multiplier <= 1 && !existingGain) {
        activeMediaElement.volume = multiplier;
        return;
      }

      const gain = getMediaGainNode(activeMediaElement);
      if (gain && mediaAudioContext) {
        activeMediaElement.volume = 1;
        if (mediaAudioContext.state === 'suspended') {
          mediaAudioContext.resume().catch(error => console.warn('Could not resume audio:', error));
        }
        gain.gain.setValueAtTime(multiplier, mediaAudioContext.currentTime);
      } else {
        // Native media volume is the fallback for browsers without Web Audio.
        activeMediaElement.volume = Math.min(1, multiplier);
      }
    }
    function connect() {
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;
      console.log('Connecting to WebSocket overlay at:', wsUrl);
      ws = new WebSocket(wsUrl);

      ws.onmessage = (event) => {
        try {
          const msg = JSON.parse(event.data);
          if (msg.type === 'media_state') {
            if (msg.state === 'playing') {
              showMedia(msg.assetName, msg.category, msg.sourceName, msg.mute, msg.volume, msg.inputKind);
            } else if (msg.state === 'hidden') {
              hideMedia();
            }
          } else if (msg.type === 'all_stopped') {
            hideMedia();
          } else if (msg.type === 'player_control') {
            controlPlayer(msg);
          }
        } catch (e) {
          console.error('Error parsing WS message:', e);
        }
      };

      ws.onclose = () => {
        console.log('WS overlay closed. Reconnecting in 2s...');
        setTimeout(connect, 2000);
      };
    }

    function showMedia(assetName, category, sourceName, mute, volume, inputKind) {
      // A previous hide's delayed cleanup must never erase this newly selected item.
      if (sourceClearTimer) {
        clearTimeout(sourceClearTimer);
        sourceClearTimer = null;
      }
      if (progressTimer) clearInterval(progressTimer);
      progressTimer = null;
      activeSourceName = sourceName || '';
      activeAssetName = assetName || '';
      activeInputKind = inputKind || '';
      activeVolume = Number.isFinite(Number(volume)) ? Number(volume) : 100;
      activeMediaElement = null;
      const ext = assetName.split('.').pop().toLowerCase();
      const isVideo = ['mp4', 'webm', 'ogg', 'mov', 'mkv'].includes(ext);
      const isAudio = ['mp3', 'wav', 'ogg', 'm4a', 'aac', 'flac'].includes(ext);

      // Hide all first
      videoPlayer.style.display = 'none';
      videoPlayer.pause();
      videoPlayer.onended = null;
      videoPlayer.muted = !!mute;

      imagePlayer.style.display = 'none';

      audioPlayer.pause();
      audioPlayer.onended = null;
      audioPlayer.muted = !!mute;

      const mediaUrl = '/media/' + assetName.split('/').map(encodeURIComponent).join('/');

      if (isVideo) {
        videoPlayer.src = mediaUrl;
        videoPlayer.style.display = 'block';
        videoPlayer.loop = false;
        activeMediaElement = videoPlayer;
        setMediaVolume(activeVolume);

        videoPlayer.onended = () => {
          hideMedia();
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ 
              action: 'ended', 
              asset: assetName, 
              sourceName: sourceName 
            }));
          }
        };

        videoPlayer.play().catch(err => {
          console.warn("Playback failed:", err);
        });
      } else if (isAudio) {
        audioPlayer.src = mediaUrl;
        audioPlayer.loop = false;
        activeMediaElement = audioPlayer;
        setMediaVolume(activeVolume);

        audioPlayer.onended = () => {
          hideMedia();
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ 
              action: 'ended', 
              asset: assetName, 
              sourceName: sourceName 
            }));
          }
        };

        audioPlayer.play().catch(err => {
          console.warn("Audio playback failed:", err);
        });
      } else {
        imagePlayer.src = mediaUrl;
        imagePlayer.style.display = 'block';
      }

      container.classList.add('visible');
      if (activeMediaElement) {
        progressTimer = setInterval(reportProgress, 500);
        reportProgress();
      }
    }

    function controlPlayer(msg) {
      if (!activeMediaElement || msg.sourceName !== activeSourceName) return;
      if (msg.action === 'mute') {
        videoPlayer.muted = !!msg.muted;
        audioPlayer.muted = !!msg.muted;
      } else if (msg.action === 'volume') {
        setMediaVolume(msg.volume);
      } else if (msg.action === 'pause') {
        activeMediaElement.pause();
        reportProgress();
      } else if (msg.action === 'play') {
        activeMediaElement.play().catch(err => console.warn('Playback failed:', err));
      } else if (msg.action === 'seek') {
        const position = Number(msg.currentTime);
        if (Number.isFinite(position) && position >= 0) {
          const duration = Number.isFinite(activeMediaElement.duration) ? activeMediaElement.duration : position;
          activeMediaElement.currentTime = Math.min(position, duration);
          reportProgress();
        }
      }
    }

    function reportProgress() {
      if (!activeMediaElement || !activeSourceName || !ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify({
        action: 'progress',
        sourceName: activeSourceName,
        asset: activeAssetName,
        currentTime: Number.isFinite(activeMediaElement.currentTime) ? activeMediaElement.currentTime : 0,
        duration: Number.isFinite(activeMediaElement.duration) ? activeMediaElement.duration : 0,
        paused: activeMediaElement.paused
      }));
    }

    function hideMedia() {
      if (progressTimer) clearInterval(progressTimer);
      progressTimer = null;
      activeSourceName = '';
      activeAssetName = '';
      activeInputKind = '';
      activeMediaElement = null;
      container.classList.remove('visible');
      videoPlayer.pause();
      audioPlayer.pause();
      if (sourceClearTimer) clearTimeout(sourceClearTimer);
      sourceClearTimer = setTimeout(() => {
        videoPlayer.src = '';
        imagePlayer.src = '';
        audioPlayer.src = '';
        videoPlayer.style.display = 'none';
        imagePlayer.style.display = 'none';
        sourceClearTimer = null;
      }, 250);
    }

    connect();
  </script>
</body>
</html>
